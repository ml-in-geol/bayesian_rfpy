name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -m 'not insight and not slow'
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cd /tmp && rfpy build-cps
